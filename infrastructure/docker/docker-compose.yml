version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: leadforge
      POSTGRES_PASSWORD: leadforge
      POSTGRES_DB: leadforge
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "leadforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../../backend
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://leadforge:leadforge@postgres:5432/leadforge?schema=public
      REDIS_URL: redis://redis:6379
    env_file: ../../backend/.env
    ports: ["4000:4000"]
    command: ["npm", "run", "dev"]

  worker:
    build:
      context: ../../backend
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://leadforge:leadforge@postgres:5432/leadforge?schema=public
      REDIS_URL: redis://redis:6379
    env_file: ../../backend/.env
    command: ["npm", "run", "worker"]

volumes:
  pgdata:
  redisdata:
